# Azurite (Azure Storage emulator) and Durable Functions Monitor. azurite.ps1 starts and removes them;
# README.md describes both. Ports are published on 127.0.0.1 only: every Azurite has the same
# well-known account key. If you change a port here, change it at the top of azurite.ps1 too.
name: azurite

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    # --skipApiVersionCheck: newer Azure SDKs send API versions this Azurite may not know yet
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Shows the Durable Functions task hubs of a storage account: orchestrations, entities, history.
  dfmon:
    image: scaletone/durablefunctionsmonitor:6.8
    container_name: dfmon
    environment:
      # The account to show, from .env: the azurite service above by default, or a real account
      AzureWebJobsStorage: "${STORAGE_CONNECTION_STRING:?Set STORAGE_CONNECTION_STRING in azurite/.env, see .env.example}"
      # Turns sign-in off. Fine while the port is published on 127.0.0.1 only.
      DFM_NONCE: i_sure_know_what_i_am_doing
    ports:
      - "127.0.0.1:7072:80"
    depends_on:
      - azurite
    restart: unless-stopped
